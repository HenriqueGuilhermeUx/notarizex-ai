[build]
  base = "notarizex-ai"
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."website-bot-onboarding"]
  external_node_modules = ["pdf-parse"]

[functions."train-bot"]
  external_node_modules = ["pdf-parse"]

[functions."client-portal"]
  external_node_modules = ["pdf-parse"]

[functions."smartbot-followup-scan"]
  schedule = "*/15 * * * *"

[functions."smartbot-trial-scan"]
  schedule = "0 13 * * *"

[[redirects]]
  from = "/b/*"
  to = "/bot-publico.html"
  status = 200

[[redirects]]
  from = "/criar"
  to = "/onboarding-inteligente.html"
  status = 200

[[redirects]]
  from = "/ativar"
  to = "/ativar-smartbot.html"
  status = 200

[[redirects]]
  from = "/admin/clientes"
  to = "/admin-clientes.html"
  status = 200

[[redirects]]
  from = "/admin/planos"
  to = "/admin-assinaturas.html"
  status = 200

[[redirects]]
  from = "/conectar-whatsapp"
  to = "/conectar-whatsapp.html"
  status = 200

[[redirects]]
  from = "/catalogo"
  to = "/catalogo-cliente.html"
  status = 200

[[redirects]]
  from = "/dashboard-cliente"
  to = "/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/portal-login.html?next=/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/painel"
  to = "/portal-login.html?next=/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/operacao"
  to = "/portal-login.html?next=/operacao-cliente.html"
  status = 200

[[redirects]]
  from = "/economia"
  to = "/economia-cliente.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/portal-login.html?next=/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/entrar"
  to = "/portal-login.html?next=/dashboard-cliente.html"
  status = 200
