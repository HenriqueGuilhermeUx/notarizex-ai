[build]
  base = "notarizex-ai"
  publish = "."
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."website-bot-onboarding"]
  external_node_modules = ["pdf-parse"]

[functions."train-bot"]
  external_node_modules = ["pdf-parse"]

[functions."smartbot-followup-scan"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "/b/*"
  to = "/bot-publico.html"
  status = 200

[[redirects]]
  from = "/criar"
  to = "/onboarding-inteligente.html"
  status = 200

[[redirects]]
  from = "/dashboard-cliente"
  to = "/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/painel"
  to = "/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/operacao"
  to = "/operacao-cliente.html"
  status = 200

[[redirects]]
  from = "/economia"
  to = "/economia-cliente.html"
  status = 200

[[redirects]]
  from = "/login"
  to = "/dashboard-cliente.html"
  status = 200

[[redirects]]
  from = "/entrar"
  to = "/dashboard-cliente.html"
  status = 200
