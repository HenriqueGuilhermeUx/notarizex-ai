name: SmartBots Trial Lifecycle Smoke
on:
  push:
    paths:
      - '.github/workflows/smartbots-trial-lifecycle-smoke.yml'
      - 'notarizex-ai/netlify/functions/smartbot-trial-scan.mjs'
      - 'netlify.toml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and schedule contract
        run: |
          set -euo pipefail
          node --check notarizex-ai/netlify/functions/smartbot-trial-scan.mjs
          grep -q '\[functions."smartbot-trial-scan"\]' netlify.toml
          grep -q 'schedule = "0 13 \* \* \*"' netlify.toml
      - name: Mock lifecycle behavior and idempotence
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          globalThis.Netlify={env:{get:(name)=>({SUPABASE_URL:'https://example.supabase.co',SUPABASE_SERVICE_ROLE_KEY:'service-test',RESEND_API_KEY:'resend-test',SMARTBOTS_ADMIN_EMAIL:'admin@example.com'}[name]||'')}};
          const now=Date.now();
          const warning={bot_id:'qa-warning',company_name:'QA Warning',owner_name:'Ana',owner_email:'ana@example.com',billing_status:'trial',trial_ends_at:new Date(now+48*3600000).toISOString()};
          const expired={bot_id:'qa-expired',company_name:'QA Expired',owner_name:'Bruno',owner_email:'bruno@example.com',billing_status:'trial',trial_ends_at:new Date(now-3600000).toISOString()};
          let eventSeq=0; const calls=[]; const existing=new Map();
          globalThis.fetch=async(url,opt={})=>{
            calls.push({url:String(url),method:opt.method||'GET',body:opt.body||null});
            if(String(url).includes('api.resend.com/emails')) return new Response(JSON.stringify({id:'email-'+calls.length}),{status:200,headers:{'content-type':'application/json'}});
            const u=new URL(String(url)); const path=u.pathname.replace('/rest/v1/','');
            if(path==='website_bots' && (!opt.method||opt.method==='GET')) return new Response(JSON.stringify([warning,expired]),{status:200});
            if(path==='smartbot_automation_events' && (!opt.method||opt.method==='GET')){
              const bot=u.searchParams.get('bot_id')?.replace('eq.','');
              const type=u.searchParams.get('event_type')?.replace('eq.','');
              const key=bot+'|'+type; return new Response(JSON.stringify(existing.get(key)||[]),{status:200});
            }
            if(path==='smartbot_automation_events' && opt.method==='POST'){
              const body=JSON.parse(opt.body); const id='event-'+(++eventSeq); const row={id,...body};
              existing.set(body.bot_id+'|'+body.event_type,[row]);
              return new Response(JSON.stringify([row]),{status:201});
            }
            if(path==='smartbot_automation_events' && opt.method==='PATCH') return new Response('',{status:204});
            if(path==='website_bots' && opt.method==='PATCH') return new Response('',{status:204});
            throw new Error('Unexpected fetch '+(opt.method||'GET')+' '+url);
          };
          const mod=await import('./notarizex-ai/netlify/functions/smartbot-trial-scan.mjs?test='+Date.now());
          await mod.default();
          const eventPosts=calls.filter(c=>c.method==='POST'&&c.url.includes('/smartbot_automation_events'));
          assert.equal(eventPosts.length,2);
          const posted=eventPosts.map(c=>JSON.parse(c.body));
          assert.equal(posted.find(x=>x.bot_id==='qa-warning').event_type,'trial_warning');
          assert.equal(posted.find(x=>x.bot_id==='qa-warning').payload.milestone,'3d');
          assert.equal(posted.find(x=>x.bot_id==='qa-expired').event_type,'trial_expired');
          const expiryPatch=calls.find(c=>c.method==='PATCH'&&c.url.includes('/website_bots')&&c.url.includes('qa-expired'));
          assert.ok(expiryPatch); assert.equal(JSON.parse(expiryPatch.body).billing_status,'trial_expired');
          assert.equal(calls.some(c=>c.url.includes('smartbot_whatsapp_config')),false,'trial scanner must not disable WhatsApp');
          assert.equal(calls.some(c=>c.url.includes('smartbot_profiles')),false,'trial scanner must not disable Brain');
          const firstEmailCount=calls.filter(c=>c.url.includes('api.resend.com/emails')).length;
          assert.equal(firstEmailCount,4,'owner + admin for warning and expiry');
          calls.length=0;
          await mod.default();
          assert.equal(calls.filter(c=>c.method==='POST'&&c.url.includes('/smartbot_automation_events')).length,0,'must not duplicate lifecycle events');
          assert.equal(calls.filter(c=>c.url.includes('api.resend.com/emails')).length,0,'must not duplicate lifecycle email for existing event');
          console.log('Soft trial lifecycle mock passed');
          NODE
