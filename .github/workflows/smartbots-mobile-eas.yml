name: NAO USAR AGORA - SmartBots Mobile - EAS Android Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile: preview gera APK; production gera AAB'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      confirm_use_eas_quota:
        description: 'Digite USAR-EAS para confirmar que quer consumir cota Expo/EAS'
        required: true
        default: 'NAO-USAR'
        type: string

jobs:
  eas-android-build:
    name: EAS Android Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbots-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}
      NPM_CONFIG_LEGACY_PEER_DEPS: true

    steps:
      - name: Stop unless explicitly confirmed
        run: |
          if [ "${{ inputs.confirm_use_eas_quota }}" != "USAR-EAS" ]; then
            echo "EAS temporariamente bloqueado: conta Expo sem cota Android."
            echo "Use o workflow: SmartBots Mobile - Signed Play Release"
            exit 1
          fi
          echo "Uso de EAS confirmado manualmente."

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: smartbots-mobile/package.json

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Generate assets
        run: npm run assets

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "Token não configurado. Crie um secret chamado EXPO_TOKEN ou EAS_TOKEN em Settings > Secrets and variables > Actions."
            exit 1
          fi
          echo "Expo token encontrado."

      - name: Run EAS Android build
        run: npx eas build -p android --profile ${{ inputs.profile }} --non-interactive --wait
