name: SmartBots Catalog E2E
on:
  push:
    paths:
      - '.github/workflows/smartbots-catalog-e2e.yml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Ask production Brain about structured catalog
        run: |
          set -euo pipefail
          body='{"botId":"qa-catalog-orion-20260923","visitorId":"qa_catalog_e2e_20260923","channel":"web","message":"Qual é o preço, a disponibilidade e a duração do Pacote Aurora 8472?"}'
          curl -fsS -X POST https://smartbots.club/.netlify/functions/smartbot-brain \
            -H 'Content-Type: application/json' \
            --data "$body" -o /tmp/result.json
          cat /tmp/result.json
          jq -e '.success == true and .engine == "responses"' /tmp/result.json >/dev/null
          reply=$(jq -r '.reply // ""' /tmp/result.json | tr '[:upper:]' '[:lower:]')
          echo "$reply" | grep -Eq '389([,.]90)?'
          echo "$reply" | grep -q '90'
          echo "$reply" | grep -qi 'consulta'
          echo 'Catalog E2E passed'
