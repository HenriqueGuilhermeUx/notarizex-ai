name: Kapso Production Diagnostic

on:
  push:
    paths:
      - '.github/workflows/kapso-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repair webhook URL token
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            -X POST \
            https://smartbots.club/__sb-kapso-fix-4d81c6 \
            -o kapso-fix.json
          cat kapso-fix.json
          jq -e '.ok == true and .endpoint.token_matches == true' kapso-fix.json >/dev/null
      - name: Re-run sanitized production diagnostic
        run: |
          set -euo pipefail
          curl --fail --show-error --silent \
            https://smartbots.club/__sb-kapso-diag-9f7e2b \
            -o kapso-diagnostic.json
          cat kapso-diagnostic.json
          jq -e '.ok == true and .kapso.webhooks[0].endpoint.token_matches == true' kapso-diagnostic.json >/dev/null
      - name: Upload diagnostic results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kapso-diagnostic
          path: |
            kapso-fix.json
            kapso-diagnostic.json
          if-no-files-found: warn
          retention-days: 1
