name: SmartBots client isolation smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smartbot-isolation-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose function routing
        shell: bash
        run: |
          set -u
          CUSTOM='https://smartbots.club'
          DEPLOY='https://6ab3018b7dc7e50008bab2b7--notarizex-ai.netlify.app'
          probe_get() {
            local name="$1" url="$2" file="/tmp/${name}.txt"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' "$url" || true)
            echo "${name}_STATUS=$code"
            echo "${name}_BODY=$(cat "$file" 2>/dev/null || true)"
          }
          probe_get CUSTOM_HEALTH "$CUSTOM/.netlify/functions/smartbots-health"
          probe_get DEPLOY_HEALTH "$DEPLOY/.netlify/functions/smartbots-health"

          MY_VISITOR="iso-mydata-${GITHUB_RUN_ID}"
          BODY=$(jq -nc --arg bot 'site-1783003313164-9eb4cb8d' --arg visitor "$MY_VISITOR" --arg msg 'Resuma em uma frase o que sua empresa faz.' '{botId:$bot,visitorId:$visitor,channel:"site",message:$msg}')
          probe_post() {
            local name="$1" url="$2" file="/tmp/${name}.txt"
            local code
            code=$(curl -sS -o "$file" -w '%{http_code}' -X POST "$url" -H 'Content-Type: application/json' --data "$BODY" || true)
            echo "${name}_STATUS=$code"
            echo "${name}_BODY=$(cat "$file" 2>/dev/null || true)"
          }
          probe_post CUSTOM_BRAIN "$CUSTOM/.netlify/functions/smartbot-brain"
          probe_post DEPLOY_BRAIN "$DEPLOY/.netlify/functions/smartbot-brain"
