name: SmartBots Mobile - Signed Play Release

on:
  workflow_dispatch:

jobs:
  signed-play-release:
    name: Build signed APK and AAB for Play
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbots-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: smartbots-mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check signing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" || (echo "ANDROID_KEYSTORE_BASE64 ausente" && exit 1)
          test -n "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" || (echo "ANDROID_KEYSTORE_PASSWORD ausente" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_ALIAS }}" || (echo "ANDROID_KEY_ALIAS ausente" && exit 1)
          test -n "${{ secrets.ANDROID_KEY_PASSWORD }}" || (echo "ANDROID_KEY_PASSWORD ausente" && exit 1)
          echo "Signing secrets encontrados."

      - name: Install dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npm install --legacy-peer-deps

      - name: Generate app assets
        run: npm run assets

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Diagnose React Native config
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v
          npx react-native config > /tmp/smartbots-rn-config.json
          head -c 2000 /tmp/smartbots-rn-config.json || true
          echo "\nReact Native config OK."

      - name: Validate JS bundle before Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartbots-bundle/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/smartbots-bundle/index.android.bundle \
            --assets-dest /tmp/smartbots-bundle/assets
          test -s /tmp/smartbots-bundle/index.android.bundle
          echo "Bundle JS validado antes do Gradle."

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Embed JS bundle into Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle
          node scripts/patch-android-disable-auto-bundle.js
          echo "Bundle JS embutido no projeto Android."

      - name: Configure release keystore
        shell: bash
        env:
          SMARTBOTS_UPLOAD_STORE_FILE: smartbots-upload-key.jks
          SMARTBOTS_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SMARTBOTS_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SMARTBOTS_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' | base64 -d > android/app/smartbots-upload-key.jks
          node scripts/write-android-signing-properties.js
          node scripts/patch-android-release-signing.js
          echo "Propriedades de assinatura gravadas com quebra de linha segura."

      - name: Build signed release APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease :app:bundleRelease --stacktrace --info --warning-mode all

      - name: Verify release signing
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -n 1)
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n 1)
          echo "APK gerado: $APK"
          echo "AAB gerado: $AAB"
          keytool -printcert -jarfile "$AAB" | tee ../smartbots-mobile-signing-report.txt
          if grep -q "Android Debug" ../smartbots-mobile-signing-report.txt; then
            echo "ERRO: AAB ainda parece assinado com debug."
            exit 1
          fi
          echo "Assinatura release verificada."

      - name: Collect release files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p play-release
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} play-release/ \; || true
          if [ -f ../smartbots-mobile-signing-report.txt ]; then cp ../smartbots-mobile-signing-report.txt play-release/signing-report.txt; fi
          if [ -d android/build/reports ]; then cp -R android/build/reports play-release/gradle-root-reports || true; fi
          if [ -d android/app/build/reports ]; then cp -R android/app/build/reports play-release/gradle-app-reports || true; fi
          cat > play-release/README.txt <<EOF
          SmartBots Hoje - Release assinado para Google Play

          Pacote Android: club.smartbots.app
          Arquivo esperado para Play Console: app-release.aab ou smartbots-hoje-release.aab
          Confira signing-report.txt antes de enviar.
          EOF
          ls -lah play-release || true

      - name: Upload signed Play release artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-hoje-signed-play-release
          path: smartbots-mobile/play-release/*
          if-no-files-found: warn
          retention-days: 30
