name: SmartBots Agenda Brain E2E

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  agenda-brain:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy
        run: sleep 25
      - name: Ask production Brain for official booking link
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://smartbots.club/.netlify/functions/smartbot-brain"
          BOT="qa-agenda-smartbots-20260922"
          VISITOR="qa_agenda_brain_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          BODY="$(jq -nc --arg bot "$BOT" --arg visitor "$VISITOR" '{botId:$bot,visitorId:$visitor,channel:"site",message:"Quero agendar uma consulta. Me passe o link oficial de agendamento."}')"
          OUT="$(curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 5 -sS -H 'content-type: application/json' -d "$BODY" "$BASE")"
          echo "$OUT" | jq -c '{success,intent,leadId,pipelineStatus,engine,model,reply}'
          test "$(echo "$OUT" | jq -r '.success')" = "true"
          test "$(echo "$OUT" | jq -r '.engine')" = "responses"
          test "$(echo "$OUT" | jq -r '.intent')" = "agendamento"
          echo "$OUT" | jq -r '.reply' | grep -Fq 'example.com/agenda/orion-5729'
          echo "VISITOR=$VISITOR LEAD=$(echo "$OUT" | jq -r '.leadId')"
