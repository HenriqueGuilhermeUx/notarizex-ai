name: SmartBots Activation Email Smoke
on:
  push:
    paths:
      - '.github/workflows/smartbots-activation-email-smoke.yml'
      - 'notarizex-ai/netlify/functions/website-bot-onboarding.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate function contract on current head
        run: |
          set -euo pipefail
          node --check notarizex-ai/netlify/functions/website-bot-onboarding.js
          node <<'NODE'
          const fs=require('fs');
          const s=fs.readFileSync('notarizex-ai/netlify/functions/website-bot-onboarding.js','utf8');
          if(!s.includes('try{await sendActivationEmail(RESEND_API_KEY,email,companyName,activation.activationUrl,activation.expiresAt)}')) throw new Error('activation email is not awaited');
          if(!s.includes('if(!response.ok)throw new Error')) throw new Error('Resend failure is not checked');
          if(s.includes('sendActivationEmail(RESEND_API_KEY,email,companyName,activation.activationUrl,activation.expiresAt).catch')) throw new Error('fire-and-forget activation email still present');
          console.log('Activation email source contract passed');
          NODE
      - name: Wait for Netlify deploy
        run: sleep 55
      - name: Validate production guardrails
        run: |
          set -euo pipefail
          code=$(curl -sS -o /tmp/missing.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/website-bot-onboarding -H 'Content-Type: application/json' --data '{}')
          test "$code" = "400"
          admin_code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/website-bot-onboarding -H 'Content-Type: application/json' --data '{"adminProvision":true,"name":"blocked","whatsapp":"5511000000000","companyName":"blocked","businessDescription":"blocked"}')
          test "$admin_code" = "403"
          echo 'Activation email contract is deployed and onboarding guardrails remain protected'
