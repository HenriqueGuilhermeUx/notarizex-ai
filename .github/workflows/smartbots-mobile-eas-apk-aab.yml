name: NAO USAR AGORA - SmartBots Mobile - EAS APK and AAB

on:
  workflow_dispatch:
    inputs:
      confirm_use_eas_quota:
        description: 'Digite USAR-EAS para confirmar que quer consumir cota Expo/EAS'
        required: true
        default: 'NAO-USAR'
        type: string

jobs:
  eas-disabled-guard:
    name: EAS quota guard
    runs-on: ubuntu-latest
    steps:
      - name: Stop unless explicitly confirmed
        run: |
          if [ "${{ inputs.confirm_use_eas_quota }}" != "USAR-EAS" ]; then
            echo "EAS temporariamente bloqueado: conta Expo sem cota Android."
            echo "Use o workflow: SmartBots Mobile - Signed Play Release"
            exit 1
          fi
          echo "Uso de EAS confirmado manualmente."

  eas-builds:
    name: EAS ${{ matrix.profile }} build
    needs: eas-disabled-guard
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: preview
            label: APK
            ext: apk
          - profile: production
            label: AAB
            ext: aab
    defaults:
      run:
        working-directory: smartbots-mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN || secrets.EAS_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: smartbots-mobile/package.json

      - name: Install dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npm install --legacy-peer-deps

      - name: Generate assets
        run: npm run assets

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Check Expo token
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN/EAS_TOKEN nao configurado."
            exit 1
          fi
          echo "Expo token encontrado."

      - name: Run EAS ${{ matrix.label }} build
        run: |
          mkdir -p build-output
          npx eas build -p android --profile ${{ matrix.profile }} --non-interactive --wait --json > build-output/eas-${{ matrix.profile }}.json

      - name: Extract artifact URL
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const profile = '${{ matrix.profile }}';
          const ext = '${{ matrix.ext }}';
          const file = path.join('build-output', `eas-${profile}.json`);
          const raw = fs.readFileSync(file, 'utf8').trim();
          let data;
          try {
            data = JSON.parse(raw);
          } catch (error) {
            console.error('Nao foi possivel ler JSON do EAS. Conteudo recebido:');
            console.error(raw);
            process.exit(1);
          }
          const urls = [];
          function walk(value) {
            if (!value) return;
            if (typeof value === 'string') {
              if (/^https?:\/\//.test(value)) urls.push(value);
              return;
            }
            if (Array.isArray(value)) return value.forEach(walk);
            if (typeof value === 'object') return Object.values(value).forEach(walk);
          }
          walk(data);
          const archiveUrl = urls.find((url) => url.includes(`.${ext}`))
            || urls.find((url) => /applicationArchive|artifacts|expo\.dev/.test(url));
          if (!archiveUrl) {
            console.error('Build terminou, mas nao encontrei URL do arquivo final no JSON do EAS.');
            console.error(raw);
            process.exit(1);
          }
          fs.writeFileSync(path.join('build-output', `artifact-${profile}.url`), archiveUrl + '\n');
          console.log(`ARTIFACT_URL=${archiveUrl}`);
          NODE

      - name: Download ${{ matrix.label }} from EAS
        run: |
          URL="$(cat build-output/artifact-${{ matrix.profile }}.url)"
          echo "Baixando ${{ matrix.label }} do EAS..."
          curl -L --fail "$URL" -o "build-output/smartbots-${{ matrix.profile }}.${{ matrix.ext }}"
          ls -lh build-output

      - name: Upload ${{ matrix.label }} artifact to GitHub
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-${{ matrix.profile }}-${{ matrix.label }}
          path: smartbots-mobile/build-output/smartbots-${{ matrix.profile }}.${{ matrix.ext }}
          if-no-files-found: error

      - name: Upload EAS metadata
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-${{ matrix.profile }}-eas-metadata
          path: smartbots-mobile/build-output/eas-${{ matrix.profile }}.json
          if-no-files-found: warn
