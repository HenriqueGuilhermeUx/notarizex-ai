name: SmartBots Commercial V1 Smoke
on:
  push:
    paths:
      - '.github/workflows/smartbots-commercial-v1-smoke.yml'
      - 'notarizex-ai/netlify/functions/subscription-admin.js'
      - 'notarizex-ai/admin-assinaturas.js'
      - 'notarizex-ai/admin-assinaturas.html'
      - 'netlify.toml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check Commercial V1
        run: |
          node --check notarizex-ai/netlify/functions/subscription-admin.js
          node --check notarizex-ai/admin-assinaturas.js
      - name: Wait for Netlify auto-deploy
        run: sleep 35
      - name: Check production commercial admin
        run: |
          set -euo pipefail
          curl -fsS https://smartbots.club/admin/planos | grep -q 'Planos, preços e limites'
          curl -sS -o /tmp/sub.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/subscription-admin -H 'Content-Type: application/json' --data '{"action":"get","botId":"site-1783003313164-9eb4cb8d"}' > /tmp/status
          test "$(cat /tmp/status)" = "401"
          grep -q 'Sessao administrativa' /tmp/sub.json
          echo 'Commercial V1 admin is live and rejects unauthenticated writes'
