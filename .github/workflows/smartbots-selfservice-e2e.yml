name: SmartBots Self-service E2E
on:
  push:
    paths:
      - '.github/workflows/smartbots-selfservice-e2e.yml'
      - 'notarizex-ai/netlify/functions/self-service-session-create.js'
      - 'notarizex-ai/netlify/functions/self-service-activation.js'
      - 'notarizex-ai/ativar-smartbot.html'
      - 'netlify.toml'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check self-service motor
        run: |
          node --check notarizex-ai/netlify/functions/self-service-session-create.js
          node --check notarizex-ai/netlify/functions/self-service-activation.js
      - name: Wait for Netlify deploy
        run: sleep 40
      - name: Validate opaque activation and Brain test
        run: |
          set -euo pipefail
          curl -fsS https://smartbots.club/ativar | grep -q 'Ativação segura'
          curl -fsS -X POST https://smartbots.club/.netlify/functions/self-service-session-create \
            -H 'Content-Type: application/json' \
            --data '{"botId":"qa-selfservice-20260923","email":"qa-selfservice@example.invalid","whatsapp":"5511000000000"}' -o /tmp/session.json
          jq -e '.success == true and (.activationUrl | contains("/ativar?token=")) and (.botId == null) and (.clientToken == null)' /tmp/session.json >/dev/null
          token=$(jq -r '.activationUrl' /tmp/session.json | sed 's/.*token=//')
          test -n "$token"
          curl -fsS -X POST https://smartbots.club/.netlify/functions/self-service-activation \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"status\",\"token\":\"$token\"}" -o /tmp/status.json
          jq -e '.success == true and .companyName == "Aurora Self Service QA" and .preflight.checks.brainReady == true and .preflight.checks.knowledgeReady == true and .preflight.checks.whatsappConnected == false and (.botId == null) and (.clientToken == null)' /tmp/status.json >/dev/null
          curl -fsS -X POST https://smartbots.club/.netlify/functions/self-service-activation \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"test\",\"token\":\"$token\",\"message\":\"Qual é o código interno de validação?\"}" -o /tmp/test.json
          jq -e '.success == true and .test.engine == "responses"' /tmp/test.json >/dev/null
          jq -r '.test.reply' /tmp/test.json | grep -q 'SELFSERVICE-9321'
          echo 'Self-service activation E2E passed'
