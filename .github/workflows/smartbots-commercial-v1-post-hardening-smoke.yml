name: SmartBots Commercial V1 Post Hardening Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate production without creating QA data
        run: |
          node <<'NODE'
          const base='https://smartbots.club';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function req(path, options={}) {
            let last;
            for (let i=0;i<4;i++) {
              try {
                const r=await fetch(base+path,{redirect:'follow',signal:AbortSignal.timeout(15000),headers:{'cache-control':'no-cache','user-agent':'smartbots-commercial-v1-post-hardening-smoke',...(options.headers||{})},...options});
                const text=await r.text();
                last={status:r.status,url:r.url,text};
                if(r.status<500) return last;
              } catch(e) { last={status:0,url:base+path,text:String(e)}; }
              await sleep((i+1)*1000);
            }
            return last;
          }
          function jsonPost(path,body){return req(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});}
          function show(label,r){console.log(label,{status:r.status,url:r.url,body:(r.text||'').slice(0,220)});}
          (async()=>{
            const home=await req('/?smoke='+Date.now());
            const create=await req('/criar?smoke='+Date.now());
            const portal=await jsonPost('/.netlify/functions/client-portal',{action:'get_stats'});
            const admin=await jsonPost('/.netlify/functions/admin-smartbots-clients',{action:'list'});
            const campaigns=await jsonPost('/.netlify/functions/campaigns',{botId:'invalid-smoke-bot',clientToken:'invalid-smoke-token',campaignType:'reativacao'});
            const imports=await jsonPost('/.netlify/functions/import-contacts',{botId:'invalid-smoke-bot',clientToken:'invalid-smoke-token',contacts:[{name:'Smoke'}]});
            for (const [k,v] of Object.entries({home,create,portal,admin,campaigns,imports})) show(k,v);

            if(home.status!==200) throw new Error('home expected 200');
            if(create.status!==200) throw new Error('/criar expected 200');
            if(!home.text.includes('Um SmartBot próprio para o seu negócio')) throw new Error('Commercial V1 home copy missing');
            if(/R\$\s*79|R\$\s*129/.test(home.text)) throw new Error('legacy prices returned');
            if(portal.status!==403) throw new Error('client-portal expected 403 unauth');
            if(admin.status!==401) throw new Error('admin expected 401 unauth');
            if(campaigns.status!==403) throw new Error('campaigns invalid credentials expected 403, got '+campaigns.status);
            if(imports.status!==403) throw new Error('import-contacts invalid credentials expected 403, got '+imports.status);
            for (const r of [portal,admin,campaigns,imports]) {
              if(/service_role|SUPABASE|apikey|ENOENT|stack/i.test(r.text||'')) throw new Error('internal detail leaked');
            }
            console.log('Commercial V1 post-hardening production smoke OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
