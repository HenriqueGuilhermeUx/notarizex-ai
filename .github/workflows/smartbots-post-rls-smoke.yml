name: SmartBots post-RLS smoke
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smartbots-post-rls-smoke.yml'
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Call production Brain
        env:
          URL: https://smartbots.club/.netlify/functions/smartbot-brain
        run: |
          BODY='{"botId":"site-1783003313164-9eb4cb8d","visitorId":"rls-smoke-20260923","channel":"web","message":"Em uma frase, o que é a MyDataMed?"}'
          RES=$(curl --fail-with-body -sS -X POST "$URL" -H 'Content-Type: application/json' --data "$BODY")
          echo "$RES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);if(!j.success||j.engine!=='responses'||!j.reply)process.exit(1);console.log(JSON.stringify({success:j.success,engine:j.engine,model:j.model,intent:j.intent}))})"
