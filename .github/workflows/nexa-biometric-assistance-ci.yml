name: Nexa Theo biometric assistance CI
on:
  push:
    branches:
      - feat/nexa-theo-biometric-assistance-20261118
  pull_request:
    paths:
      - 'notarizex-ai/netlify/functions/lib/nexa-kyc-assistance.js'
      - 'notarizex-ai/netlify/functions/lib/nexa-reactive-onboarding.js'
      - 'notarizex-ai/netlify/functions/lib/nexa-telegram-support.js'
      - 'notarizex-ai/test/nexa-biometric-assistance.test.js'
      - '.github/workflows/nexa-biometric-assistance-ci.yml'
permissions:
  contents: read
jobs:
  support:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Guard scope - no webhook routing, financial code or credentials
        run: |
          node - <<'NODE'
          const cp=require('node:child_process'),assert=require('node:assert/strict');
          const changed=cp.execFileSync('git',['diff','--name-only','origin/main...HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set([
            'notarizex-ai/netlify/functions/lib/nexa-kyc-assistance.js',
            'notarizex-ai/netlify/functions/lib/nexa-reactive-onboarding.js',
            'notarizex-ai/netlify/functions/lib/nexa-telegram-support.js',
            'notarizex-ai/test/nexa-biometric-assistance.test.js',
            '.github/workflows/nexa-biometric-assistance-ci.yml',
          ]);
          assert.deepEqual(changed.filter(p=>!allowed.has(p)),[]);
          NODE
      - name: Node syntax and full reactive regression
        run: |
          node --check notarizex-ai/netlify/functions/lib/nexa-kyc-assistance.js
          node --check notarizex-ai/netlify/functions/lib/nexa-reactive-onboarding.js
          node --check notarizex-ai/netlify/functions/lib/nexa-telegram-support.js
          node --test notarizex-ai/test/nexa-biometric-assistance.test.js notarizex-ai/test/nexa-reactive-onboarding.test.js notarizex-ai/test/nexa-kyc-assistance.test.js notarizex-ai/test/nexa-resolutive-support.test.js
      - name: Telegram webhook unchanged regression
        working-directory: notarizex-ai
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          node --test test/nexa-telegram-support.test.js
