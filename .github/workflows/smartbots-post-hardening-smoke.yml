name: SmartBots Post Hardening Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production Brain
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://smartbots.club/.netlify/functions/smartbot-brain"
          VISITOR="qa_post_hardening_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          BODY="$(jq -nc --arg v "$VISITOR" '{botId:"site-1783003313164-9eb4cb8d",visitorId:$v,channel:"site",message:"Em uma frase, o que a MyDataMed oferece?"}')"
          OUT="$(curl --fail-with-body --retry 4 --retry-all-errors --retry-delay 5 -sS -H 'content-type: application/json' -d "$BODY" "$BASE")"
          echo "$OUT" | jq -c '{success,intent,leadSaved,engine,model,conversationId,reply}'
          test "$(echo "$OUT" | jq -r '.success')" = "true"
          test "$(echo "$OUT" | jq -r '.engine')" = "responses"
          test "$(echo "$OUT" | jq -r '.model')" = "gpt-5.6-luna"
          test "$(echo "$OUT" | jq -r '.leadSaved')" = "false"
          echo "VISITOR=$VISITOR"
