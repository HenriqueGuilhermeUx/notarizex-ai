name: SmartBots HTTP Diagnostic Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smartbots-http-diagnostic-temp.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe public production
        shell: bash
        run: |
          set -o pipefail
          for path in / /dashboard /operacao '/.netlify/functions/smartbots-health'; do
            echo "===== $path ====="
            curl --retry 3 --retry-delay 1 --connect-timeout 10 --max-time 20 -sS -i "https://smartbots.club${path}" | head -n 30 || true
            echo
          done
