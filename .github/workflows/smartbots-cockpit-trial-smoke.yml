name: SmartBots Cockpit Trial Smoke
on:
  push:
    paths:
      - '.github/workflows/smartbots-cockpit-trial-smoke.yml'
      - 'notarizex-ai/netlify/functions/admin-smartbots-clients.js'
      - 'notarizex-ai/admin-clientes.js'
      - 'notarizex-ai/admin-clientes.html'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and source contracts
        run: |
          set -euo pipefail
          node --check notarizex-ai/netlify/functions/admin-smartbots-clients.js
          node --check notarizex-ai/admin-clientes.js
          grep -q 'trial_ends_at' notarizex-ai/netlify/functions/admin-smartbots-clients.js
          grep -q 'Ação comercial' notarizex-ai/admin-clientes.html
          grep -q "function trialState" notarizex-ai/admin-clientes.js
          grep -q "btn.textContent='Verificando...'" notarizex-ai/admin-clientes.js
      - name: Wait for Netlify deploy
        run: sleep 55
      - name: Validate protected production cockpit
        run: |
          set -euo pipefail
          curl -fsS https://smartbots.club/admin/clientes -o /tmp/cockpit.html
          grep -q 'Ação comercial' /tmp/cockpit.html
          curl -fsS https://smartbots.club/admin-clientes.js -o /tmp/cockpit.js
          grep -q 'Trial expirado' /tmp/cockpit.js
          code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/admin-smartbots-clients -H 'Content-Type: application/json' --data '{"action":"list"}')
          test "$code" = "401"
          echo 'Cockpit trial visibility is live and protected'
