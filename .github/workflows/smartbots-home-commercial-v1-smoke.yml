name: SmartBots Home Commercial V1 Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate source contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const home = fs.readFileSync('notarizex-ai/index.html','utf8');
          const onboarding = fs.readFileSync('notarizex-ai/onboarding-inteligente.html','utf8');
          const netlify = fs.readFileSync('netlify.toml','utf8');
          const must = (cond,msg) => { if(!cond) throw new Error(msg); };
          must(home.includes('href="/criar"'), 'home CTA must route to /criar');
          must(home.includes('7 dias'), 'home must communicate 7-day trial');
          must(!/R\$\s*79|R\$\s*129/.test(home), 'legacy hardcoded prices remain on home');
          must(!home.includes('Bot para Site'), 'home still sells site bot as separate product');
          must(!home.includes('Bot WhatsApp'), 'home still sells WhatsApp bot as separate product');
          must(!/clientToken|paymentLink|botId/.test(home), 'home exposes technical/payment internals');
          must(netlify.includes('from = "/criar"') && netlify.includes('to = "/onboarding-inteligente.html"'), '/criar redirect is missing');
          must(onboarding.includes('/.netlify/functions/website-bot-onboarding'), 'modern onboarding function is not used');
          must(onboarding.includes('activationUrl'), 'onboarding must consume opaque activationUrl');
          must(!/R\$\s*79|R\$\s*129/.test(onboarding), 'legacy hardcoded prices remain in onboarding');
          must(!onboarding.includes('paymentLink'), 'onboarding still expects paymentLink');
          console.log('Commercial V1 source contracts OK');
          NODE

      - name: Diagnose production availability and validate Commercial V1
        run: |
          node <<'NODE'
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function get(url){
            let last;
            for(let i=1;i<=4;i++){
              try{
                const r=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(15000),headers:{'cache-control':'no-cache','user-agent':'smartbots-commercial-v1-smoke'}});
                const text=await r.text();
                if(r.status>=500 && i<4){last={status:r.status,url:r.url,text};await sleep(i*1500);continue;}
                return {status:r.status,url:r.url,text};
              }catch(e){last=e;if(i<4)await sleep(i*1500);else throw e}
            }
            return last;
          }
          function summary(label,r){console.log(label,{status:r.status,url:r.url,length:r.text?.length||0,body:(r.text||'').slice(0,300)});}
          (async()=>{
            const stamp=Date.now();
            const customHome=await get('https://smartbots.club/?smoke='+stamp);
            const customCreate=await get('https://smartbots.club/criar?smoke='+stamp);
            const branchHome=await get('https://main--notarizex-ai.netlify.app/?smoke='+stamp);
            const deployHome=await get('https://6ab40e800fcf350008d594bc--notarizex-ai.netlify.app/?smoke='+stamp);
            summary('custom home',customHome);
            summary('custom create',customCreate);
            summary('branch home',branchHome);
            summary('deploy home',deployHome);
            if(customHome.status!==200 || customCreate.status!==200){
              const sameInfraFailure=branchHome.status>=500 && deployHome.status>=500;
              throw new Error(sameInfraFailure ? 'Netlify site availability failure affects custom, branch and deploy URLs' : 'custom-domain production availability failure');
            }
            const home=customHome, create=customCreate;
            if(!home.text.includes('Um SmartBot próprio para o seu negócio')) throw new Error('new Commercial V1 home not published');
            if(!home.text.includes('href="/criar"')) throw new Error('home CTA /criar missing');
            if(/R\$\s*79|R\$\s*129/.test(home.text)) throw new Error('legacy prices still public');
            if(home.text.includes('Bot para Site') || home.text.includes('Bot WhatsApp')) throw new Error('legacy split-product copy still public');
            if(/clientToken|paymentLink|botId/.test(home.text)) throw new Error('technical/payment internals exposed on home');
            if(!create.text.includes('Onboarding Inteligente')) throw new Error('/criar does not serve modern onboarding');
            if(!create.text.includes('activationUrl')) throw new Error('/criar does not consume activationUrl');
            if(create.text.includes('paymentLink')) throw new Error('/criar still expects paymentLink');
            console.log('Commercial V1 production home OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
