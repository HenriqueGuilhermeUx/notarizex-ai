name: SmartBots Portal Session Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Syntax check server and browser JS
        run: |
          node --check notarizex-ai/netlify/functions/lib/client-portal-session.js
          node --check notarizex-ai/netlify/functions/self-service-activation.js
          node --check notarizex-ai/netlify/functions/client-portal.js
          node --check notarizex-ai/netlify/functions/agenda-pro-config.js
          node --check notarizex-ai/agenda-pro.js
          node <<'NODE'
          const fs = require('fs');
          for (const file of ['notarizex-ai/dashboard-cliente.html','notarizex-ai/operacao-cliente.html','notarizex-ai/ativar-smartbot.html']) {
            const html = fs.readFileSync(file,'utf8');
            const scripts = [...html.matchAll(/<script(?![^>]*\bsrc=)[^>]*>([\s\S]*?)<\/script>/gi)].map(m=>m[1]);
            if (!scripts.length) throw new Error(`No inline script found in ${file}`);
            for (const script of scripts) new Function(script);
            console.log(`parsed ${file}`);
          }
          NODE

      - name: Validate opaque-session source contracts
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = p => fs.readFileSync(p,'utf8');
          const activation = read('notarizex-ai/netlify/functions/self-service-activation.js');
          const dashboard = read('notarizex-ai/dashboard-cliente.html');
          const operation = read('notarizex-ai/operacao-cliente.html');
          const portal = read('notarizex-ai/netlify/functions/client-portal.js');
          const agenda = read('notarizex-ai/agenda-pro.js');
          function must(cond,msg){ if(!cond) throw new Error(msg); }
          must(activation.includes('portalSession:await createPortalSession(bot)'), 'activation must issue opaque portal session');
          must(!activation.includes('portalSession:{botId:'), 'activation still returns botId session');
          must(dashboard.includes('portalToken'), 'dashboard missing portalToken session');
          must(!dashboard.includes('state.clientToken'), 'dashboard persists clientToken state');
          must(!dashboard.includes('state.botId'), 'dashboard persists botId state');
          must(operation.includes('portalToken'), 'operation missing portalToken session');
          must(!operation.includes('state.clientToken'), 'operation persists clientToken state');
          must(!operation.includes('state.botId'), 'operation persists botId state');
          must(portal.includes('resolvePortalSession(portalToken)'), 'client portal does not resolve opaque session server-side');
          must(portal.includes('portalSession: await createPortalSession(bot)'), 'legacy login does not upgrade to opaque session');
          must(agenda.includes('portalToken'), 'agenda still depends on technical credentials');
          console.log('opaque-session contracts OK');
          NODE

      - name: Wait for Netlify production and validate guardrails
        run: |
          node <<'NODE'
          const sleep = ms => new Promise(r=>setTimeout(r,ms));
          const base = 'https://smartbots.club';
          async function get(path){ const r=await fetch(base+path,{cache:'no-store'}); return {status:r.status,text:await r.text()}; }
          async function post(path,body){ const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}); return {status:r.status,text:await r.text()}; }
          (async()=>{
            let ready=false;
            for(let i=0;i<36;i++){
              try{
                const d=await get('/dashboard');
                const o=await get('/operacao');
                if(d.status===200 && o.status===200 && d.text.includes('portalToken') && o.text.includes('portalToken') && !d.text.includes('state.clientToken') && !o.text.includes('state.clientToken')) { ready=true; break; }
              }catch{}
              await sleep(10000);
            }
            if(!ready) throw new Error('Netlify did not publish opaque-session pages in time');
            const activation=await post('/.netlify/functions/self-service-activation',{});
            if(activation.status!==422 || /clientToken|service_role|SUPABASE/i.test(activation.text)) throw new Error(`activation guard failed: ${activation.status} ${activation.text}`);
            const portal=await post('/.netlify/functions/client-portal',{action:'get_stats'});
            if(portal.status!==403 || /clientToken|service_role|SUPABASE/i.test(portal.text)) throw new Error(`portal guard failed: ${portal.status} ${portal.text}`);
            const agenda=await post('/.netlify/functions/agenda-pro-config',{action:'list'});
            if(agenda.status!==403 || /clientToken|service_role|SUPABASE/i.test(agenda.text)) throw new Error(`agenda guard failed: ${agenda.status} ${agenda.text}`);
            console.log('production opaque-session guardrails OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
