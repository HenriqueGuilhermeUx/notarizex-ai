name: SmartBots Mobile - Generate Upload Keystore

on:
  workflow_dispatch:
    inputs:
      alias:
        description: 'Key alias'
        required: true
        default: 'smartbots-upload'
      validity_days:
        description: 'Validade em dias'
        required: true
        default: '10000'

jobs:
  generate-upload-keystore:
    name: Generate Android upload keystore
    runs-on: ubuntu-latest

    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Generate keystore and secret package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p keystore-output
          STORE_PASSWORD=$(openssl rand -base64 36 | tr -d '\n/=+' | cut -c1-32)
          KEY_PASSWORD=$(openssl rand -base64 36 | tr -d '\n/=+' | cut -c1-32)
          KEY_ALIAS='${{ inputs.alias }}'
          VALIDITY='${{ inputs.validity_days }}'
          KEYSTORE_FILE='smartbots-upload-key.jks'

          keytool -genkeypair \
            -v \
            -storetype JKS \
            -keystore "keystore-output/$KEYSTORE_FILE" \
            -alias "$KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity "$VALIDITY" \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=SmartBots Hoje, OU=SmartBots, O=SmartBots, L=Rio de Janeiro, ST=RJ, C=BR"

          BASE64_KEYSTORE=$(base64 -w 0 "keystore-output/$KEYSTORE_FILE")

          cat > keystore-output/GITHUB-SECRETS.txt <<EOF
          Crie estes secrets no GitHub em Settings > Secrets and variables > Actions:

          ANDROID_KEYSTORE_BASE64=$BASE64_KEYSTORE
          ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD
          ANDROID_KEY_ALIAS=$KEY_ALIAS
          ANDROID_KEY_PASSWORD=$KEY_PASSWORD
          EOF

          cat > keystore-output/LEIA-ME.txt <<EOF
          IMPORTANTE

          Este pacote contém a upload keystore do Android para publicar o app SmartBots Hoje.
          Guarde com segurança. Não commite esta chave no repositório.
          Depois de configurar os secrets no GitHub, rode o workflow:
          SmartBots Mobile - Signed Play Release

          Arquivos:
          - smartbots-upload-key.jks: chave de upload
          - GITHUB-SECRETS.txt: valores para cadastrar no GitHub Actions
          EOF

      - name: Upload keystore package
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-android-upload-keystore-package
          path: keystore-output/*
          if-no-files-found: error
          retention-days: 7
