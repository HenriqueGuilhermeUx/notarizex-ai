name: Kapso Multi-client Smoke

on:
  push:
    paths:
      - '.github/workflows/kapso-multiclient-smoke.yml'
      - 'notarizex-ai/netlify/functions/kapso-multiclient-smoke.js'

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for production deploy and validate Kapso multi-client motor
        shell: bash
        run: |
          set -euo pipefail
          sleep 25
          JSON="$(curl -fsS --retry 6 --retry-delay 5 https://smartbots.club/.netlify/functions/kapso-multiclient-smoke)"
          echo "$JSON" | jq '{ok, kapsoApi, dbConfigFound, customerMapped, customerPhoneLookupOk, projectLifecycleWebhookActive, pilotMessageWebhookActive, legacyPilotSetupLinksHttpStatus, ephemeralCustomerCreateStatus, ephemeralSetupLinkCreateStatus, ephemeralCleanupStatus, setupLinkCapability, noSecretsReturned}'
          echo "$JSON" | jq -e '
            .ok == true and
            .kapsoApi == true and
            .dbConfigFound == true and
            .customerMapped == true and
            .customerPhoneLookupOk == true and
            .projectLifecycleWebhookActive == true and
            .pilotMessageWebhookActive == true and
            .ephemeralCustomerCreateStatus == 201 and
            .ephemeralSetupLinkCreateStatus == 201 and
            .ephemeralCleanupStatus == 204 and
            .setupLinkCapability == true and
            .noSecretsReturned == true
          '
