name: SmartBots Trial Onboarding E2E
on:
  push:
    paths:
      - '.github/workflows/smartbots-trial-onboarding-e2e.yml'
      - 'notarizex-ai/netlify/functions/website-bot-onboarding.js'
      - 'notarizex-ai/onboarding-inteligente.html'
      - 'notarizex-ai/admin-clientes.js'

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax and contract checks
        run: |
          set -euo pipefail
          node --check notarizex-ai/netlify/functions/website-bot-onboarding.js
          node --check notarizex-ai/admin-clientes.js
          grep -q "adminProvision:true" notarizex-ai/admin-clientes.js
          grep -q "X-Admin-Session" notarizex-ai/admin-clientes.js
          grep -q "activationUrl" notarizex-ai/onboarding-inteligente.html
          ! grep -q "Continuar para pagamento" notarizex-ai/onboarding-inteligente.html
          ! grep -q "Bot ID:" notarizex-ai/onboarding-inteligente.html
      - name: Wait for Netlify production deploy
        run: sleep 65
      - name: Validate public trial onboarding
        run: |
          set -euo pipefail
          curl -fsS https://smartbots.club/criar | grep -q 'período de avaliação de 7 dias'
          code=$(curl -sS -o /tmp/create.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/website-bot-onboarding \
            -H 'Content-Type: application/json' \
            --data '{"name":"QA Trial","email":"qa-trial-20260923@example.invalid","whatsapp":"5511000007719","companyName":"Aurora Trial QA 7719","businessType":"servicos","businessDescription":"Empresa QA temporária. Código exclusivo TRIALFLOW-7719. Oferece somente validação automatizada do onboarding."}')
          echo "create HTTP=$code"; cat /tmp/create.json
          test "$code" = "200"
          jq -e '.activationUrl | contains("https://smartbots.club/ativar?token=")' /tmp/create.json >/dev/null
          jq -e '.billingStatus == "trial" and .status == "onboarding" and .brain == "responses"' /tmp/create.json >/dev/null
          jq -e 'has("botId") | not' /tmp/create.json >/dev/null
          jq -e 'has("clientToken") | not' /tmp/create.json >/dev/null
          jq -e 'has("paymentLink") | not' /tmp/create.json >/dev/null
          token=$(jq -r '.activationUrl' /tmp/create.json | sed 's/.*token=//')
          status_code=$(curl -sS -o /tmp/status.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/self-service-activation \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"status\",\"token\":\"$token\"}")
          echo "status HTTP=$status_code"; cat /tmp/status.json
          test "$status_code" = "200"
          jq -e '.companyName == "Aurora Trial QA 7719" and .billingStatus == "trial" and .preflight.checks.brainReady == true and .preflight.checks.knowledgeReady == true and .preflight.checks.whatsappConnected == false' /tmp/status.json >/dev/null
          brain_code=$(curl -sS -o /tmp/brain.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/self-service-activation \
            -H 'Content-Type: application/json' \
            --data "{\"action\":\"test\",\"token\":\"$token\",\"message\":\"Qual é o código exclusivo desta empresa?\"}")
          echo "brain HTTP=$brain_code"; cat /tmp/brain.json
          test "$brain_code" = "200"
          jq -e '.test.engine == "responses"' /tmp/brain.json >/dev/null
          jq -r '.test.reply' /tmp/brain.json | grep -q 'TRIALFLOW-7719'
          admin_code=$(curl -sS -o /tmp/admin.json -w '%{http_code}' -X POST https://smartbots.club/.netlify/functions/website-bot-onboarding \
            -H 'Content-Type: application/json' \
            --data '{"adminProvision":true,"name":"No Auth","whatsapp":"5511000000000","companyName":"Blocked Admin","businessDescription":"should not create"}')
          echo "unauth admin HTTP=$admin_code"; cat /tmp/admin.json
          test "$admin_code" = "403"
          echo 'Trial-first onboarding E2E passed'
