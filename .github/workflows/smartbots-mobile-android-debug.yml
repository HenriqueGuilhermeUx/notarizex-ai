name: SmartBots Mobile - Android Installable APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'smartbots-mobile/**'
      - '.github/workflows/smartbots-mobile-android-debug.yml'

jobs:
  build-installable-apk:
    name: Build Android Installable APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbots-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: smartbots-mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npm install --legacy-peer-deps

      - name: Generate assets
        run: npm run assets

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Bundle JavaScript into APK
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res

      - name: Build installable APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-hoje-installable-apk
          path: smartbots-mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
