name: SmartBots Mobile - Android Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'smartbots-mobile/**'
      - '.github/workflows/smartbots-mobile-android-debug.yml'

jobs:
  build-debug-apk:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbots-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: smartbots-mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Generate assets
        run: npm run assets

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Build debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-hoje-debug-apk
          path: smartbots-mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
