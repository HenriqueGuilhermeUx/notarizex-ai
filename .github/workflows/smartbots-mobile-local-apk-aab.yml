name: SmartBots Mobile - Local APK and AAB

on:
  workflow_dispatch:
  push:
    paths:
      - 'smartbots-mobile/**'
      - '.github/workflows/smartbots-mobile-local-apk-aab.yml'

jobs:
  local-android-build:
    name: Local Android APK and AAB
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smartbots-mobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
          cache-dependency-path: smartbots-mobile/package.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        env:
          NPM_CONFIG_LEGACY_PEER_DEPS: 'true'
        run: npm install --legacy-peer-deps

      - name: Generate app assets
        run: npm run assets

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Diagnose React Native config
        shell: bash
        run: |
          set -euo pipefail
          node -v
          npm -v
          npx react-native config > /tmp/smartbots-rn-config.json
          head -c 2000 /tmp/smartbots-rn-config.json || true
          echo "\nReact Native config OK."

      - name: Validate JS bundle before Gradle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/smartbots-bundle/assets
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output /tmp/smartbots-bundle/index.android.bundle \
            --assets-dest /tmp/smartbots-bundle/assets
          test -s /tmp/smartbots-bundle/index.android.bundle
          echo "Bundle JS validado antes do Gradle."

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      - name: Embed JS bundle into Android project
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets android/app/src/main/res
          npx expo export:embed \
            --platform android \
            --dev false \
            --entry-file index.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res
          test -s android/app/src/main/assets/index.android.bundle
          node scripts/patch-android-disable-auto-bundle.js
          echo "Bundle JS embutido no projeto Android."

      - name: Build APK and AAB with Gradle
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x ./gradlew
          ./gradlew clean :app:assembleRelease :app:bundleRelease --stacktrace --info --warning-mode all

      - name: Collect Android outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-output
          find android/app/build/outputs -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} build-output/ \; || true
          if [ -d android/build/reports ]; then cp -R android/build/reports build-output/gradle-root-reports || true; fi
          if [ -d android/app/build/reports ]; then cp -R android/app/build/reports build-output/gradle-app-reports || true; fi
          ls -lah build-output || true

      - name: Upload local APK and AAB artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartbots-local-apk-aab
          path: smartbots-mobile/build-output/*
          if-no-files-found: warn
