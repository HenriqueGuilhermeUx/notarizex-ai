name: SmartBots Netlify Deploy Temp

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/smartbots-netlify-deploy-temp.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: 293da4ea-5e3f-4bee-8954-b15fcf6c3d82
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Require Netlify credential
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo 'NETLIFY_AUTH_TOKEN secret is not configured.' >&2
            exit 2
          fi
      - name: Deploy production HEAD
        run: npx -y netlify-cli@latest deploy --prod --site "$NETLIFY_SITE_ID" --message "SmartBots secure portal Commercial V1"
