name: SmartBots Client Portal Runtime Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate client portal production runtime
        run: |
          node <<'NODE'
          const base='https://smartbots.club';
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function post(path, body){
            let last;
            for(let i=0;i<30;i++){
              try{
                const r=await fetch(base+path,{method:'POST',headers:{'content-type':'application/json','cache-control':'no-cache'},body:JSON.stringify(body),signal:AbortSignal.timeout(15000)});
                const text=await r.text();
                last={status:r.status,text};
                if(r.status===403) return last;
                if(r.status!==502 && r.status!==503) return last;
              }catch(e){last={status:0,text:String(e)}}
              await sleep(5000);
            }
            return last;
          }
          (async()=>{
            const portal=await post('/.netlify/functions/client-portal',{action:'get_stats'});
            console.log('client-portal',{status:portal.status,body:(portal.text||'').slice(0,500)});
            if(portal.status!==403) throw new Error(`client-portal guard expected 403, got ${portal.status}: ${portal.text}`);
            if(/ENOENT|05-versions-space\.pdf|service_role|SUPABASE/i.test(portal.text)) throw new Error('client-portal leaked runtime/internal detail');
            const agenda=await post('/.netlify/functions/agenda-pro-config',{action:'list'});
            console.log('agenda-pro-config',{status:agenda.status,body:(agenda.text||'').slice(0,300)});
            if(agenda.status!==403) throw new Error(`agenda guard expected 403, got ${agenda.status}`);
            console.log('client portal runtime guardrails OK');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
