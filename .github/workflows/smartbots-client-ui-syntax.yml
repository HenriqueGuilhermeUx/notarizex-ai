name: SmartBots Client UI Syntax

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Extract and validate inline client scripts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re, pathlib
          for path in ['notarizex-ai/dashboard-cliente.html','notarizex-ai/operacao-cliente.html']:
              text=pathlib.Path(path).read_text(encoding='utf-8')
              scripts=re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',text,re.S|re.I)
              inline=[s for s in scripts if s.strip()]
              if not inline:
                  raise SystemExit(f'no inline script found: {path}')
              out=pathlib.Path('/tmp')/(pathlib.Path(path).stem+'.js')
              out.write_text('\n'.join(inline),encoding='utf-8')
              print(out)
          PY
          node --check /tmp/dashboard-cliente.js
          node --check /tmp/operacao-cliente.js
