name: SmartBots Activation UI Smoke
on:
  push:
    paths:
      - '.github/workflows/smartbots-activation-ui-smoke.yml'
      - 'notarizex-ai/admin-clientes.js'
      - 'notarizex-ai/admin-clientes.html'
      - 'notarizex-ai/conectar-whatsapp.html'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check admin UI
        run: node --check notarizex-ai/admin-clientes.js
      - name: Wait for Netlify auto-deploy
        run: sleep 35
      - name: Check activation pages in production
        run: |
          set -euo pipefail
          curl -fsS https://smartbots.club/admin-clientes.html | grep -q 'Cockpit de onboarding'
          curl -fsS https://smartbots.club/conectar-whatsapp.html | grep -q 'Conecte o WhatsApp da sua empresa'
          curl -fsS https://smartbots.club/admin-clientes.js -o /tmp/admin-clientes.js
          node --check /tmp/admin-clientes.js
          echo 'Activation cockpit is live'
