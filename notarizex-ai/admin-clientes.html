<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes SmartBots</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-7xl mx-auto p-4 md:p-6"><div class="flex justify-between items-center gap-3 mb-4"><a href="/admin-manual.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots · Clientes</a><div class="flex gap-2"><a href="/admin-assinaturas.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Planos</a><a href="/painel" class="bg-white/10 px-4 py-2 rounded-xl font-black">Painel</a></div></div>
<section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-4"><h1 class="text-3xl font-black">Cockpit de onboarding</h1><p class="text-gray-400 mt-2">Crie o SmartBot, gere um link seguro e acompanhe a conexão do WhatsApp de cada cliente.</p></section>
<section id="loginCard" class="bg-slate-900 border border-white/10 rounded-2xl p-5 mb-4"><label class="text-xs font-black uppercase tracking-wider text-gray-400">Acesso administrativo</label><div class="grid md:grid-cols-[1fr_auto] gap-2 mt-2"><input id="adminEmail" type="email" class="bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Seu e-mail autorizado"><button id="codeBtn" onclick="requestCode()" class="bg-white/10 px-5 py-3 rounded-xl font-black">Enviar código</button></div><div id="codeArea" class="hidden grid md:grid-cols-[1fr_auto] gap-2 mt-2"><input id="adminCode" inputmode="numeric" maxlength="6" class="bg-slate-950 border border-white/10 rounded-xl p-3 tracking-[.35em]" placeholder="000000"><button id="verifyBtn" onclick="verifyCode()" class="bg-green-400 text-black px-5 py-3 rounded-xl font-black">Entrar</button></div><div id="adminMsg" class="text-sm text-gray-400 mt-2"></div></section>
<div id="cockpit" class="hidden"><section class="bg-slate-900 border border-white/10 rounded-2xl p-5 mb-4"><div class="flex justify-between items-center gap-3"><div><h2 class="text-xl font-black">Novo cliente</h2><p class="text-sm text-gray-400">Informe o básico. O SmartBots lê o site e prepara o Brain; depois você envia o link do WhatsApp.</p></div><button id="toggleCreate" onclick="toggleCreateForm()" class="bg-white/10 px-4 py-2 rounded-xl font-black">+ Criar</button></div><div id="createForm" class="hidden mt-5 grid md:grid-cols-2 gap-3"><input id="ownerName" class="bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Nome do responsável"><input id="ownerEmail" class="bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="E-mail (opcional)"><input id="ownerWhatsapp" class="bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="WhatsApp do responsável"><input id="companyName" class="bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Empresa"><input id="website" class="md:col-span-2 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="https://site-do-cliente.com (opcional)"><textarea id="businessDescription" class="md:col-span-2 bg-slate-950 border border-white/10 rounded-xl p-3 min-h-28" placeholder="Descrição do negócio, serviços e particularidades. Use se não houver site ou para complementar."></textarea><div class="md:col-span-2 flex gap-2 items-center"><button id="createBtn" onclick="createClient()" class="bg-green-400 text-black px-5 py-3 rounded-xl font-black">Criar SmartBot</button><span id="createMsg" class="text-sm text-gray-400"></span></div></div></section>
<section id="totals" class="grid md:grid-cols-4 gap-3 mb-4"></section><section id="list" class="space-y-3 text-gray-400">Carregando...</section></div></main><script src="/admin-clientes.js"></script></body></html>
