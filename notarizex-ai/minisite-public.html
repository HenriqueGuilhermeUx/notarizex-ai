<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="index,follow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>MiniSite · SmartBots</title>
<meta name="description" content="Atendimento inteligente">
<style>
:root{--accent:#00ff88;--bg:#07100c;--surface:#0f1713;--surface2:#141f19;--text:#f6fff9;--muted:#9fb0a6;--border:rgba(255,255,255,.11);--shadow:0 24px 70px rgba(0,0,0,.28)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.55}a{color:inherit}.wrap{width:min(1120px,calc(100% - 36px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;padding:22px 0;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:42px;height:42px;border-radius:12px;object-fit:contain;background:#fff}.brand-dot{width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 30px var(--accent)}.nav-actions{display:flex;gap:10px;align-items:center}.btn{border:0;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:900;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-1px)}.btn-primary{background:var(--accent);color:#04110a}.btn-soft{background:rgba(255,255,255,.07);border:1px solid var(--border);color:var(--text)}.hero{padding:64px 0 54px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);gap:40px;align-items:center}.eyebrow{font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.18em;color:var(--accent);margin-bottom:14px}.hero h1{font-size:clamp(42px,7vw,76px);line-height:.98;letter-spacing:-.05em;margin:0;max-width:850px}.hero p{font-size:clamp(17px,2vw,21px);color:var(--muted);max-width:720px;margin:24px 0}.hero-actions{display:flex;flex-wrap:wrap;gap:12px}.hero-card{border:1px solid var(--border);background:linear-gradient(145deg,var(--surface2),var(--surface));border-radius:28px;min-height:360px;box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;justify-content:flex-end;position:relative;overflow:hidden}.hero-card:before{content:"";position:absolute;width:240px;height:240px;border-radius:50%;background:var(--accent);filter:blur(90px);opacity:.2;right:-40px;top:-50px}.hero-image{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.7}.hero-card-content{position:relative;z-index:2;background:linear-gradient(180deg,transparent,rgba(0,0,0,.72));margin:-26px;padding:80px 26px 26px}.hero-card small{color:var(--muted);font-weight:800}.hero-card b{font-size:28px;display:block;margin-top:6px}.section{padding:52px 0}.section-head{max-width:760px;margin-bottom:24px}.section h2{font-size:clamp(30px,4vw,44px);letter-spacing:-.035em;margin:0 0 10px}.section-lead{color:var(--muted);margin:0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:22px}.card h3{margin:0 0 8px;font-size:19px}.card p{margin:0;color:var(--muted)}.badge{display:inline-flex;border-radius:999px;padding:5px 9px;background:color-mix(in srgb,var(--accent) 13%,transparent);color:var(--accent);font-weight:900;font-size:11px;margin-bottom:12px}.price{font-size:18px;font-weight:900;margin-top:14px;color:var(--text)}.about{display:grid;grid-template-columns:.8fr 1.2fr;gap:24px;align-items:start}.about-box{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px}.about-box p{color:var(--muted);font-size:18px;margin:0}.faq{display:grid;gap:10px}.faq details{border:1px solid var(--border);background:var(--surface);border-radius:16px;padding:0 18px}.faq summary{cursor:pointer;font-weight:900;padding:18px 0}.faq p{color:var(--muted);margin:0 0 18px}.cta-band{margin:40px 0 70px;border-radius:28px;padding:34px;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 18%,var(--surface)),var(--surface));border:1px solid color-mix(in srgb,var(--accent) 30%,var(--border));display:flex;justify-content:space-between;align-items:center;gap:24px}.cta-band h2{margin:0;font-size:32px}.cta-band p{margin:8px 0 0;color:var(--muted)}footer{border-top:1px solid var(--border);padding:28px 0 48px;color:var(--muted);font-size:13px}.footer-row{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}.powered{text-decoration:none}.powered b{color:var(--text)}.chat-fab{position:fixed;right:20px;bottom:20px;border:0;border-radius:999px;background:var(--accent);color:#06120b;font-weight:950;padding:15px 18px;box-shadow:0 18px 50px rgba(0,0,0,.35);cursor:pointer;z-index:20}.chat-panel{position:fixed;right:20px;bottom:82px;width:min(390px,calc(100vw - 28px));height:min(600px,calc(100vh - 115px));background:#0d1511;border:1px solid var(--border);border-radius:22px;box-shadow:0 30px 90px rgba(0,0,0,.48);z-index:30;display:none;overflow:hidden}.chat-panel.open{display:flex;flex-direction:column}.chat-head{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;border-bottom:1px solid var(--border);font-weight:900}.chat-close{border:0;background:transparent;color:#fff;font-size:24px;cursor:pointer}.chat-log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:9px}.bubble{max-width:86%;border-radius:14px;padding:11px 12px;white-space:pre-wrap}.bubble.user{background:var(--accent);color:#07110b;align-self:flex-end}.bubble.bot{background:rgba(255,255,255,.08);align-self:flex-start}.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--border)}.chat-form input{flex:1;background:#07100c;border:1px solid var(--border);border-radius:12px;padding:12px;color:#fff;outline:none}.chat-form button{border:0;border-radius:12px;background:var(--accent);font-weight:900;padding:0 14px;cursor:pointer}.empty{display:none}.loading{min-height:80vh;display:grid;place-items:center;color:var(--muted)}.error-box{display:none;max-width:600px;margin:100px auto;padding:24px;border:1px solid rgba(248,113,113,.35);background:rgba(248,113,113,.08);border-radius:18px}
body.theme-light{--bg:#f7faf8;--surface:#fff;--surface2:#edf5f0;--text:#102118;--muted:#607166;--border:rgba(10,40,22,.12);--shadow:0 24px 70px rgba(32,70,45,.13)}
body.theme-ocean{--bg:#07111f;--surface:#0b1728;--surface2:#10223a;--text:#f5f9ff;--muted:#a6b6ca;--border:rgba(255,255,255,.1)}
body.theme-warm{--bg:#15100b;--surface:#20170f;--surface2:#2b1e13;--text:#fffaf4;--muted:#c9b7a5;--border:rgba(255,255,255,.1)}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:38px}.hero-card{min-height:280px}.grid{grid-template-columns:1fr 1fr}.about{grid-template-columns:1fr}.cta-band{align-items:flex-start;flex-direction:column}}
@media(max-width:560px){.wrap{width:min(100% - 24px,1120px)}.nav-actions .btn-soft{display:none}.hero h1{font-size:44px}.grid{grid-template-columns:1fr}.section{padding:38px 0}.cta-band{margin-bottom:50px}.chat-panel{right:14px;bottom:76px}.chat-fab{right:14px;bottom:14px}}
</style>
</head>
<body>
<div id="loading" class="loading">Carregando…</div>
<div id="errorBox" class="error-box">Este MiniSite não está disponível.</div>
<div id="app" style="display:none">
<header class="wrap nav">
  <div class="brand"><img id="brandLogo" class="logo" alt="" style="display:none"><span id="brandDot" class="brand-dot"></span><span id="brandName">Empresa</span></div>
  <div class="nav-actions"><a id="navSecondary" class="btn btn-soft" style="display:none" target="_blank" rel="noopener">Saiba mais</a><button class="btn btn-primary" data-primary>Falar agora</button></div>
</header>
<main>
  <section class="wrap hero">
    <div><div id="eyebrow" class="eyebrow"></div><h1 id="title"></h1><p id="subtitle"></p><div class="hero-actions"><button class="btn btn-primary" data-primary></button><a id="heroSecondary" class="btn btn-soft" style="display:none" target="_blank" rel="noopener"></a></div></div>
    <div class="hero-card" id="heroCard"><img id="heroImage" class="hero-image" alt="" style="display:none"><div class="hero-card-content"><small>Atendimento inteligente</small><b id="heroCompany"></b></div></div>
  </section>
  <section id="aboutSection" class="wrap section about"><div><div class="eyebrow">Sobre</div><h2 id="aboutTitle"></h2></div><div class="about-box"><p id="aboutText"></p></div></section>
  <div id="dynamicSections"></div>
  <section id="faqSection" class="wrap section"><div class="section-head"><div class="eyebrow">Perguntas frequentes</div><h2>Dúvidas comuns</h2></div><div id="faq" class="faq"></div></section>
  <section class="wrap cta-band"><div><h2>Quer saber mais?</h2><p>Converse agora com o atendimento inteligente da empresa.</p></div><button class="btn btn-primary" data-primary>Começar conversa</button></section>
</main>
<footer><div class="wrap footer-row"><span id="footerContact"></span><a class="powered" href="https://smartbots.club" target="_blank" rel="noopener">Atendimento por <b>SmartBots</b></a></div></footer>
<button id="chatFab" class="chat-fab">💬 Falar agora</button>
<div id="chatPanel" class="chat-panel" aria-live="polite">
 <div class="chat-head"><span id="chatTitle">Atendimento</span><button id="chatClose" class="chat-close" aria-label="Fechar">×</button></div>
 <div id="chatLog" class="chat-log"></div>
 <form id="chatForm" class="chat-form"><input id="chatInput" autocomplete="off" placeholder="Digite sua mensagem…"><button>Enviar</button></form>
</div>
</div>
<script src="/minisite-public.js"></script>
</body>
</html>
