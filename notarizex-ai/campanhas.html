<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartBots — Campanhas</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">
  <main class="max-w-4xl mx-auto p-4">
    <div class="flex justify-between items-center mb-4">
      <a href="/crm.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots</a>
      <a href="/crm.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Voltar ao CRM</a>
    </div>
    <section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-5">
      <h1 class="text-2xl font-black">Campanhas</h1>
      <p class="text-gray-400 mt-2">Crie rascunhos de reativação e Indique e Ganhe. O envio automático por WhatsApp entra depois.</p>
    </section>
    <div class="grid md:grid-cols-2 gap-4">
      <button onclick="createCampaign('reativacao')" class="bg-slate-900 border border-white/10 rounded-2xl p-6 text-left hover:border-green-400">
        <div class="text-3xl mb-3">♻️</div><h2 class="font-black text-xl">Reativação</h2><p class="text-gray-400 mt-2">Para contatos antigos, orçamentos perdidos e clientes que sumiram.</p>
      </button>
      <button onclick="createCampaign('indicacao')" class="bg-slate-900 border border-white/10 rounded-2xl p-6 text-left hover:border-green-400">
        <div class="text-3xl mb-3">🎁</div><h2 class="font-black text-xl">Indique e Ganhe</h2><p class="text-gray-400 mt-2">Para clientes satisfeitos indicarem novos clientes.</p>
      </button>
    </div>
    <div id="result" class="mt-5 bg-white/5 border border-white/10 rounded-2xl p-5 text-gray-400">Escolha uma campanha.</div>
  </main>
  <script src="/campanhas.js"></script>
</body>
</html>
