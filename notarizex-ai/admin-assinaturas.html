<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Assinaturas</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-4xl mx-auto p-4"><div class="flex justify-between mb-4"><a href="/admin-manual.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots Assinaturas</a><a href="/admin-manual.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Admin</a></div><section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-4"><h1 class="text-3xl font-black">Controle de assinatura</h1><p class="text-gray-400 mt-2">Marque plano e status do cliente.</p></section><section class="bg-slate-900 border border-white/10 rounded-2xl p-5"><input id="adminToken" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Admin token"><input id="botId" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Bot ID"><input id="companyName" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Empresa"><input id="email" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="E-mail"><select id="plan" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3"><option>Essencial</option><option selected>Profissional</option><option>Premium</option></select><select id="status" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3"><option value="pending">pending</option><option value="active">active</option><option value="overdue">overdue</option><option value="canceled">canceled</option><option value="trial">trial</option></select><textarea id="notes" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Observações"></textarea><button onclick="saveSub()" class="bg-green-400 text-black px-4 py-3 rounded-xl font-black">Salvar assinatura</button><button onclick="getSub()" class="bg-white/10 px-4 py-3 rounded-xl font-black ml-2">Consultar</button><pre id="result" class="mt-4 bg-black/40 rounded-xl p-3 text-sm overflow-auto">Aguardando...</pre></section></main><script src="/admin-assinaturas.js"></script></body></html>
