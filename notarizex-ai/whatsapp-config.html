<!doctype html><html><head><meta charset="utf-8"><title>WhatsApp SmartBots</title><link rel="stylesheet" href="/app-ux.css"></head><body><main><div class="sb-top"><a class="sb-brand" href="/operacao.html"><span>Smart</span>Bots</a><a class="sb-pill" href="/operacao.html">Central</a></div><section class="sb-hero"><h1>Configurar WhatsApp</h1><p>Escolha o modo de atendimento: assistido, provedor rapido ou oficial.</p></section><section class="sb-box"><label>Numero WhatsApp</label><input id="phone" placeholder="5511999999999"><label>Nome do negocio</label><input id="businessName" placeholder="Nome da empresa"><label>Modo</label><select id="mode"><option value="assisted">Assistido</option><option value="automatic">Automatico</option></select><label>Provedor</label><select id="provider"><option value="manual">Manual / WhatsApp normal</option><option value="zapi">Z-API / QR Code</option><option value="twilio">Twilio / Oficial</option><option value="official">Meta Cloud API</option></select><label>Saudacao</label><textarea id="greeting" rows="4" placeholder="Olá! Como posso ajudar?"></textarea><label>Mensagem fora de horario</label><textarea id="awayMessage" rows="4"></textarea><label>Mensagem para humano</label><textarea id="humanMessage" rows="4"></textarea><button class="sb-btn" onclick="saveConfig()">Salvar</button><button class="sb-pill" onclick="loadConfig()">Carregar</button><pre id="result">Aguardando...</pre></section></main><script src="/whatsapp-config.js"></script><script src="/app-ux.js"></script></body></html>
