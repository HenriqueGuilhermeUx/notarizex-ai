<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atendimento Inteligente</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-xl mx-auto p-4 min-h-screen flex flex-col"><section class="bg-white/5 border border-white/10 rounded-2xl p-5 mb-4"><h1 class="text-2xl font-black">Atendimento inteligente</h1><p class="text-gray-400 mt-2">Fale com o assistente virtual. Ele registra seu contato e ajuda a equipe a retornar mais rápido.</p></section><section class="bg-slate-900 border border-white/10 rounded-2xl overflow-hidden flex-1"><div id="chat" class="h-[520px] overflow-auto p-4 flex flex-col gap-3"><div class="bg-white/10 rounded-xl p-3">Olá! Posso ajudar com orçamento, agendamento, dúvidas ou atendimento humano.</div></div><div class="grid grid-cols-2 gap-2 p-3 border-t border-white/10"><button onclick="send('Quero um orçamento')" class="bg-white/10 rounded-xl p-3">Orçamento</button><button onclick="send('Quero agendar um horário')" class="bg-white/10 rounded-xl p-3">Agendar</button><button onclick="send('Tenho uma dúvida')" class="bg-white/10 rounded-xl p-3">Dúvida</button><button onclick="send('Quero falar com um humano')" class="bg-white/10 rounded-xl p-3">Humano</button></div><form id="form" class="flex gap-2 p-3 border-t border-white/10"><input id="text" class="flex-1 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Digite sua mensagem"><button class="bg-green-400 text-black rounded-xl px-4 font-black">Enviar</button></form></section></main><script src="/bot-publico.js"></script></body></html>
