<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SmartBots">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/app-icon.svg">
  <link rel="stylesheet" href="/smartbots-pwa.css">
  <title>SmartBots Hoje</title>
</head>
<body>
  <div id="login" class="sb-screen">
    <div class="sb-login-card">
      <img src="/app-icon.svg" class="sb-app-icon" alt="SmartBots">
      <p class="sb-kicker">SMARTBOTS HOJE</p>
      <h1>SmartBots Hoje</h1>
      <p class="sb-muted">CRM, bot, agenda, mensagens e WhatsApp assistido em um app simples para vender mais.</p>
      <div id="startActions" class="sb-stack">
        <button class="sb-primary" data-mode="signup">Criar meu negócio</button>
        <button class="sb-secondary" data-mode="login">Já tenho acesso</button>
        <button class="sb-link" data-mode="tech">Acesso técnico</button>
      </div>
      <form id="signupForm" class="sb-stack hidden">
        <h2>Criar negócio</h2>
        <input id="businessName" placeholder="Nome do negócio">
        <input id="ownerName" placeholder="Seu nome">
        <input id="email" type="email" placeholder="E-mail">
        <input id="phone" inputmode="tel" placeholder="WhatsApp">
        <input id="segment" placeholder="Segmento">
        <input id="city" placeholder="Cidade/região">
        <button class="sb-primary" type="submit">Criar app e mini site</button>
        <button class="sb-link" type="button" data-back>Voltar</button>
      </form>
      <form id="loginForm" class="sb-stack hidden">
        <h2>Entrar</h2>
        <input id="botId" placeholder="Código da empresa">
        <input id="clientToken" type="password" placeholder="Código de acesso">
        <button class="sb-primary" type="submit">Entrar</button>
        <button class="sb-link" type="button" data-back>Voltar</button>
      </form>
      <form id="techForm" class="sb-stack hidden">
        <h2>Acesso técnico</h2>
        <input id="techBotId" placeholder="Bot ID">
        <input id="techToken" type="password" placeholder="Client token">
        <button class="sb-primary" type="submit">Entrar</button>
        <button class="sb-link" type="button" data-back>Voltar</button>
      </form>
      <p id="authMessage" class="sb-message"></p>
      <p class="sb-footnote">A SmartBots prepara mensagens e abre o WhatsApp do cliente. Não faz disparo automático sem configuração específica.</p>
    </div>
  </div>

  <div id="app" class="hidden">
    <main id="content" class="sb-content"></main>
    <nav class="sb-tabs">
      <button data-tab="hoje" class="active"><span>⌂</span>Hoje</button>
      <button data-tab="crm"><span>▣</span>CRM</button>
      <button data-tab="acoes"><span>✓</span>Ações</button>
      <button data-tab="mensagens"><span>💬</span>Mensagens</button>
      <button data-tab="oportunidades"><span>＋</span>Oportunidades</button>
      <button data-tab="mais"><span>☰</span>Mais</button>
    </nav>
  </div>

  <script src="/smartbots-pwa.js"></script>
</body>
</html>
