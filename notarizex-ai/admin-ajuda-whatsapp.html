<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ajuda WhatsApp · SmartBots</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-6xl mx-auto p-4 md:p-6"><div class="flex flex-wrap justify-between items-center gap-3 mb-4"><a href="/admin-clientes.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots · Ajuda WhatsApp</a><div class="flex gap-2"><a href="/admin-clientes.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Clientes</a><a href="/admin-assinaturas.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Planos</a></div></div><section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-4"><h1 class="text-3xl font-black">Onboarding assistido</h1><p class="text-gray-400 mt-2">Empresas que pediram ajuda para preparar ou conectar o WhatsApp. Aqui ficam apenas pedidos abertos.</p></section><section id="loginCard" class="bg-slate-900 border border-white/10 rounded-2xl p-5 mb-4"><label class="text-xs font-black uppercase tracking-wider text-gray-400">Acesso administrativo</label><div class="grid md:grid-cols-[1fr_auto] gap-2 mt-2"><input id="adminEmail" type="email" class="bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Seu e-mail autorizado"><button id="codeBtn" class="bg-white/10 px-5 py-3 rounded-xl font-black" onclick="requestCode()">Enviar código</button></div><div id="codeArea" class="hidden grid md:grid-cols-[1fr_auto] gap-2 mt-2"><input id="adminCode" inputmode="numeric" maxlength="6" class="bg-slate-950 border border-white/10 rounded-xl p-3 tracking-[.35em]" placeholder="000000"><button id="verifyBtn" class="bg-green-400 text-black px-5 py-3 rounded-xl font-black" onclick="verifyCode()">Entrar</button></div><div id="adminMsg" class="text-sm text-gray-400 mt-2"></div></section><div id="app" class="hidden"><section class="flex flex-wrap gap-3 mb-4"><div class="bg-white/5 border border-white/10 rounded-xl p-4"><b id="count" class="text-2xl">0</b><div class="text-gray-400">pedidos abertos</div></div><button onclick="loadHelp()" class="bg-white/10 px-4 py-2 rounded-xl font-black self-center">Atualizar</button></section><section id="list" class="space-y-3 text-gray-400">Carregando...</section></div></main><script>
function el(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function session(){return sessionStorage.getItem('sb_admin_session')||''}
function setLogged(on){el('loginCard').classList.toggle('hidden',on);el('app').classList.toggle('hidden',!on)}
async function authApi(body,s){var h={'Content-Type':'application/json'};if(s)h['X-Admin-Session']=s;var r=await fetch('/.netlify/functions/smartbots-admin-auth',{method:'POST',headers:h,body:JSON.stringify(body)}),j={};try{j=await r.json()}catch(_){}if(!r.ok||j.success===false)throw new Error(j.error||'Falha de acesso');return j}
async function requestCode(){var email=el('adminEmail').value.trim();if(!email){el('adminMsg').textContent='Informe seu e-mail.';return}var b=el('codeBtn');b.disabled=true;b.textContent='Enviando...';try{await authApi({action:'request',email:email});sessionStorage.setItem('sb_admin_email',email);el('codeArea').classList.remove('hidden');el('adminMsg').textContent='Código enviado.'}catch(e){el('adminMsg').textContent=e.message}finally{b.disabled=false;b.textContent='Enviar código'}}
async function verifyCode(){var email=el('adminEmail').value.trim(),code=el('adminCode').value.trim(),b=el('verifyBtn');b.disabled=true;b.textContent='Entrando...';try{var j=await authApi({action:'verify',email:email,code:code});sessionStorage.setItem('sb_admin_session',j.sessionToken);setLogged(true);await loadHelp()}catch(e){el('adminMsg').textContent=e.message}finally{b.disabled=false;b.textContent='Entrar'}}
async function api(body){var s=session();if(!s)throw new Error('Sessão expirada.');var r=await fetch('/.netlify/functions/admin-whatsapp-help',{method:'POST',headers:{'Content-Type':'application/json','X-Admin-Session':s},body:JSON.stringify(body)}),j={};try{j=await r.json()}catch(_){}if(r.status===401){sessionStorage.removeItem('sb_admin_session');setLogged(false);throw new Error('Sessão expirada.')}if(!r.ok||j.success===false)throw new Error(j.error||'Falha administrativa');return j}
function modeLabel(v){return v==='business'?'WhatsApp Business no celular':v==='personal'?'WhatsApp comum / precisa preparar':v==='dedicated'?'Número dedicado':'Pediu ajuda'}
function phoneLink(v){var p=String(v||'').replace(/\D/g,'');return p?'https://wa.me/'+p:''}
function render(items){el('count').textContent=items.length;el('list').innerHTML=items.map(function(x){var started=x.status==='in_progress',wa=phoneLink(x.contact_whatsapp);return '<article class="bg-slate-900 border '+(started?'border-amber-400/30':'border-green-400/30')+' rounded-2xl p-5"><div class="flex flex-col md:flex-row justify-between gap-4"><div><div class="text-xl font-black text-white">'+esc(x.company_name||x.bot_id)+'</div><div class="text-sm text-gray-400 mt-1">'+esc(x.contact_name||'')+(x.contact_email?' · '+esc(x.contact_email):'')+'</div><div class="text-xs text-gray-500 mt-2">'+esc(modeLabel(x.selected_mode))+' · '+esc(new Date(x.last_requested_at||x.requested_at).toLocaleString('pt-BR'))+'</div></div><div><span class="inline-block px-3 py-1 rounded-full text-xs font-black '+(started?'bg-amber-400/15 text-amber-300':'bg-green-400/15 text-green-300')+'">'+(started?'Em atendimento':'Novo pedido')+'</span></div></div><div class="flex flex-wrap gap-2 mt-4">'+(wa?'<a target="_blank" rel="noopener" href="'+wa+'" class="bg-green-400 text-black px-4 py-2 rounded-xl font-black">Chamar no WhatsApp ↗</a>':'')+(x.contact_email?'<a href="mailto:'+esc(x.contact_email)+'" class="bg-white/10 px-4 py-2 rounded-xl font-black">Enviar e-mail</a>':'')+(!started?'<button onclick="startHelp('+x.id+',this)" class="bg-white/10 px-4 py-2 rounded-xl font-black">Assumir atendimento</button>':'')+'<button onclick="resolveHelp('+x.id+',this)" class="bg-white/10 px-4 py-2 rounded-xl font-black">Marcar resolvido</button></div></article>'}).join('')||'<div class="bg-slate-900 border border-white/10 rounded-2xl p-6">Nenhum pedido de ajuda aberto. ✓</div>'}
async function loadHelp(){el('list').textContent='Carregando...';try{var j=await api({action:'list'});render(j.items||[])}catch(e){el('list').textContent='Erro: '+e.message}}
async function startHelp(id,b){b.disabled=true;try{await api({action:'start',id:id});await loadHelp()}catch(e){alert(e.message);b.disabled=false}}
async function resolveHelp(id,b){if(!confirm('Marcar este onboarding como resolvido?'))return;b.disabled=true;try{await api({action:'resolve',id:id});await loadHelp()}catch(e){alert(e.message);b.disabled=false}}
(async function(){var email=sessionStorage.getItem('sb_admin_email')||'';if(email)el('adminEmail').value=email;var s=session();if(!s)return;try{var j=await authApi({action:'validate'},s);if(j.success){setLogged(true);await loadHelp()}}catch(_){sessionStorage.removeItem('sb_admin_session')}})();
</script></body></html>
