<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartBots Agenda</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-5xl mx-auto p-4"><div class="flex justify-between items-center mb-4"><a href="/operacao.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots Agenda</a><a href="/crm.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">CRM</a></div><section class="bg-white/5 border border-white/10 rounded-2xl p-5 mb-4"><h1 class="text-2xl font-black">Agenda simples</h1><p class="text-gray-400">Registre solicitações de horário e acompanhe os próximos atendimentos.</p></section><section class="grid md:grid-cols-2 gap-4"><div class="bg-slate-900 border border-white/10 rounded-2xl p-5"><h2 class="font-black mb-3">Novo agendamento</h2><input id="name" class="w-full mb-2 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Nome"><input id="phone" class="w-full mb-2 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Telefone"><input id="service" class="w-full mb-2 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Serviço"><input id="date" type="datetime-local" class="w-full mb-2 bg-slate-950 border border-white/10 rounded-xl p-3"><textarea id="notes" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Observação"></textarea><button onclick="createAppt()" class="bg-green-400 text-black px-4 py-3 rounded-xl font-black">Salvar agendamento</button><div id="msg" class="mt-3 text-gray-400"></div></div><div class="bg-slate-900 border border-white/10 rounded-2xl p-5"><div class="flex justify-between"><h2 class="font-black mb-3">Próximos</h2><button onclick="loadAppts()" class="text-green-400">Atualizar</button></div><div id="list" class="text-gray-400">Carregando...</div></div></section></main><script src="/agenda.js"></script></body></html>
