<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Testar SmartBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{background:#0f1115;color:white;font-family:Inter,Arial,sans-serif}.card{background:#181b22;border:1px solid #30343d;border-radius:18px}.field{background:#101318;border:1px solid #30343d;border-radius:12px;color:white;padding:12px;width:100%}.btn{background:#00ff88;color:#07110b;font-weight:900;border-radius:12px;padding:12px 16px}.msg{padding:12px 14px;border-radius:14px;white-space:pre-wrap;line-height:1.45}.user{background:#00ff88;color:#07110b;align-self:flex-end}.bot{background:#252a33;color:#e5e7eb;align-self:flex-start}.pill{font-size:12px;font-weight:800;border-radius:999px;padding:6px 10px;background:#2b2412;color:#fbbf24}
  </style>
</head>
<body>
  <header class="border-b border-white/10 p-4"><div class="max-w-4xl mx-auto flex justify-between"><a href="/dashboard-cliente.html" class="font-black text-xl"><span style="color:#00ff88">Smart</span>Bots</a><span id="status" class="pill">Teste</span></div></header>
  <main class="max-w-4xl mx-auto p-4">
    <section class="card p-5 mb-4">
      <h1 class="text-2xl font-black mb-2">Testar Bot</h1>
      <p class="text-gray-400 text-sm mb-4">Use seu Bot ID para testar a resposta antes de instalar no site.</p>
      <label class="text-sm text-gray-300 font-bold">Bot ID</label>
      <input id="botId" class="field mt-2 font-mono" placeholder="site-...">
    </section>
    <section class="card overflow-hidden">
      <div id="chat" class="h-[500px] overflow-auto p-4 flex flex-col gap-3"><div class="msg bot">Olá! Digite uma pergunta para testar o SmartBot.</div></div>
      <form id="form" class="p-4 border-t border-white/10 flex gap-3"><input id="text" class="field" placeholder="Digite sua mensagem..."><button class="btn">Enviar</button></form>
    </section>
  </main>
  <script>
    function getSavedBot(){try{var s=JSON.parse(localStorage.getItem('sb_session')||'{}');return s.botId||''}catch(e){return ''}}
    botId.value = new URLSearchParams(location.search).get('botId') || getSavedBot();
    var visitorId = localStorage.getItem('sb_test_visitor') || ('test-'+Date.now()); localStorage.setItem('sb_test_visitor', visitorId);
    function add(t,c){var d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;return d}
    form.onsubmit=async function(e){e.preventDefault();var b=botId.value.trim();var m=text.value.trim();if(!b||!m)return alert('Informe Bot ID e mensagem');text.value='';add(m,'user');var wait=add('Pensando...','bot');try{var r=await fetch('/.netlify/functions/smartbot-chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({botId:b,visitorId:visitorId,channel:'site',message:m})});var j=await r.json();wait.textContent=j.reply||j.error||'Sem resposta';status.textContent=j.aiUsed?'IA ativa':'Fallback'}catch(err){wait.textContent='Erro: '+err.message;status.textContent='Erro'}};
  </script>
</body>
</html>
