<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartBots Mini Site</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-6xl mx-auto p-4"><div class="flex justify-between items-center mb-4"><a href="/operacao.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots Mini Site</a><a href="/operacao.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Operação</a></div><section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-5"><h1 class="text-2xl font-black">Mini site com bot + QR Code</h1><p class="text-gray-400 mt-2">Para clientes sem site: escolha um visual, gere um link público e imprima o QR Code.</p></section><section class="grid md:grid-cols-2 gap-5"><div class="bg-slate-900 border border-white/10 rounded-2xl p-5"><label class="text-sm text-gray-300">Título</label><input id="title" class="w-full mt-2 mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Ex: Salão da Maria"><label class="text-sm text-gray-300">Descrição</label><textarea id="subtitle" class="w-full mt-2 mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" rows="4" placeholder="Ex: Agende seu horário, tire dúvidas e fale conosco."></textarea><label class="text-sm text-gray-300">Botão principal</label><input id="cta" class="w-full mt-2 mb-3 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="Começar atendimento"><label class="text-sm text-gray-300">Visual de fundo</label><select id="theme" class="w-full mt-2 mb-4 bg-slate-950 border border-white/10 rounded-xl p-3"><option value="dark">Escuro moderno</option><option value="green">Verde SmartBots</option><option value="blue">Azul profissional</option><option value="gold">Premium dourado</option><option value="beauty">Beleza / estética</option><option value="clinic">Clínica limpa</option></select><button onclick="saveSite()" class="bg-green-400 text-black px-5 py-3 rounded-xl font-black">Salvar mini site</button><div id="msg" class="mt-3 text-gray-400"></div></div><div class="bg-slate-900 border border-white/10 rounded-2xl p-5"><h2 class="font-black text-xl mb-3">Link e QR Code</h2><input id="publicLink" readonly class="w-full bg-slate-950 border border-white/10 rounded-xl p-3 text-sm"><button onclick="copyLink()" class="mt-3 bg-white/10 px-4 py-2 rounded-xl font-black">Copiar link</button><a id="openLink" target="_blank" class="inline-block mt-3 ml-2 bg-green-400 text-black px-4 py-2 rounded-xl font-black">Abrir</a><div id="qr" class="mt-5 bg-white p-4 rounded-2xl inline-block"></div><p class="text-gray-500 text-sm mt-4">Use este QR Code em balcão, cartão, Instagram, recepção ou material impresso.</p></div></section></main><script src="/mini-site.js"></script></body></html>
