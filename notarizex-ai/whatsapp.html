<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartBots WhatsApp Assistido</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 text-white"><main class="max-w-6xl mx-auto p-4"><div class="flex justify-between items-center mb-4"><a href="/operacao.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots WhatsApp</a><a href="/operacao.html" class="bg-white/10 px-4 py-2 rounded-xl font-black">Operação</a></div><section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-5"><h1 class="text-2xl font-black">WhatsApp assistido</h1><p class="text-gray-400 mt-2">Envio manual e seguro: escolha um contato, revise a mensagem e abra o WhatsApp. A automação oficial entra depois.</p></section><section class="grid lg:grid-cols-3 gap-4"><div class="bg-slate-900 border border-white/10 rounded-2xl p-5"><h2 class="font-black text-xl mb-3">Mensagem rápida</h2><input id="phone" class="w-full mb-2 bg-slate-950 border border-white/10 rounded-xl p-3" placeholder="WhatsApp com DDD"><select id="template" onchange="setTemplate()" class="w-full mb-2 bg-slate-950 border border-white/10 rounded-xl p-3"><option value="orcamento">Orçamento</option><option value="agendamento">Agendamento</option><option value="reativacao">Reativação</option><option value="indicacao">Indicação</option><option value="retorno">Retorno</option><option value="humano">Humano</option></select><textarea id="message" rows="8" class="w-full mb-3 bg-slate-950 border border-white/10 rounded-xl p-3"></textarea><div class="flex gap-2"><button onclick="copyMsg()" class="bg-white/10 px-4 py-2 rounded-xl font-black">Copiar</button><button onclick="openManual()" class="bg-green-400 text-black px-4 py-2 rounded-xl font-black">Abrir WhatsApp</button></div><div id="status" class="text-gray-400 text-sm mt-3"></div></div><div class="lg:col-span-2 bg-slate-900 border border-white/10 rounded-2xl p-5"><div class="flex justify-between items-center mb-3"><h2 class="font-black text-xl">Contatos e oportunidades</h2><button onclick="loadContacts()" class="text-green-400">Atualizar</button></div><div id="list" class="text-gray-400">Carregando...</div></div></section></main><script src="/whatsapp-assistido.js"></script></body></html>
