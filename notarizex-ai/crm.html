<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SmartBots CRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white">
  <main class="max-w-[1800px] mx-auto p-4">
    <div class="flex flex-col md:flex-row md:justify-between md:items-center gap-3 mb-4">
      <a href="/dashboard-cliente.html" class="font-black text-xl"><span class="text-green-400">Smart</span>Bots CRM</a>
      <div class="flex flex-wrap gap-2">
        <a href="/whatsapp.html" class="bg-green-400 text-black px-4 py-2 rounded-xl font-black">WhatsApp</a>
        <a href="/testar-bot.html" class="bg-white/10 text-white px-4 py-2 rounded-xl font-black">Testar bot</a>

        <a href="/campanhas.html" class="bg-white/10 text-white px-4 py-2 rounded-xl font-black">Campanhas</a>

    </div>
    <section class="bg-white/5 border border-white/10 rounded-2xl p-6 mb-5">
      <h1 class="text-2xl font-black">Oportunidades</h1>
      <p class="text-gray-400 mt-2">Esteira: novo, reativação, contatado, agendado, executado, retorno e perdido.</p>

    <section id="board" class="grid md:grid-cols-2 xl:grid-cols-4 2xl:grid-cols-7 gap-4"></section>

  <script src="/crm-ui.js"></script>
<script src="/crm-agenda-link.js"></script>
